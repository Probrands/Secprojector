<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEC Insider Alert Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      overflow: hidden;
      height: 100vh;
    }

    #header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      height: 52px;
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    #header .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #header .brand .dot {
      width: 10px;
      height: 10px;
      background: #2ecc71;
      border-radius: 50%;
      animation: pulse-green 2s infinite;
    }

    #header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #fff;
    }

    #header .stats {
      font-size: 12px;
      color: #888;
      display: flex;
      gap: 16px;
    }

    #header .stats span {
      color: #ccc;
      font-weight: 500;
    }

    #map {
      position: fixed;
      top: 52px;
      left: 0;
      right: 340px;
      bottom: 0;
    }

    #sidebar {
      position: fixed;
      top: 52px;
      right: 0;
      bottom: 0;
      width: 340px;
      background: #0f0f0f;
      border-left: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      z-index: 999;
    }

    #sidebar-header {
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #sidebar-header h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #999;
    }

    #filter-select {
      background: #1a1a1a;
      color: #ccc;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
    }

    #alert-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    #alert-list::-webkit-scrollbar { width: 4px; }
    #alert-list::-webkit-scrollbar-track { background: transparent; }
    #alert-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .alert-card {
      background: #161616;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .alert-card:hover {
      background: #1c1c1c;
      border-color: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .alert-card .ticker-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .alert-card .ticker {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    .alert-card .confidence {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .conf-very-high { background: rgba(231, 76, 60, 0.15); color: #e74c3c; }
    .conf-high { background: rgba(46, 204, 113, 0.15); color: #2ecc71; }

    .alert-card .company {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .alert-card .details {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #666;
    }

    .alert-card .details .value {
      color: #2ecc71;
      font-weight: 600;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #555;
      text-align: center;
      padding: 40px;
    }

    .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
    .empty-state p { font-size: 13px; line-height: 1.6; }

    /* Leaflet popup overrides */
    .leaflet-popup-content-wrapper {
      background: #1a1a1a !important;
      color: #e0e0e0 !important;
      border-radius: 12px !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6) !important;
    }

    .leaflet-popup-tip { background: #1a1a1a !important; }

    .leaflet-popup-close-button {
      color: #666 !important;
      font-size: 18px !important;
    }

    .popup-content { min-width: 220px; padding: 4px; }

    .popup-content .popup-ticker {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
    }

    .popup-content .popup-company {
      font-size: 12px;
      color: #888;
      margin-bottom: 12px;
    }

    .popup-content .popup-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 12px;
    }

    .popup-content .popup-row:last-child { border-bottom: none; }
    .popup-content .popup-label { color: #888; }
    .popup-content .popup-value { color: #e0e0e0; font-weight: 500; }
    .popup-content .popup-value.green { color: #2ecc71; }

    .popup-content .popup-conf {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    @keyframes pulse-green {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @keyframes marker-pulse {
      0%   { transform: scale(1); opacity: 0.9; }
      50%  { transform: scale(1.6); opacity: 0; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .marker-pulse {
      position: absolute;
      border-radius: 50%;
      animation: marker-pulse 2.5s ease-out infinite;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      #map { right: 0; bottom: 45%; }
      #sidebar { top: auto; left: 0; width: 100%; height: 45%; border-left: none; border-top: 1px solid rgba(255, 255, 255, 0.06); }
    }
  </style>
</head>
<body>
  <div id="header">
    <div class="brand">
      <div class="dot"></div>
      <h1>SEC Insider Alert Map</h1>
    </div>
    <div class="stats">
      <div>Purchases: <span id="stat-count">0</span></div>
      <div>Companies: <span id="stat-companies">0</span></div>
    </div>
  </div>

  <div id="map"></div>

  <div id="sidebar">
    <div id="sidebar-header">
      <h2>Recent Alerts</h2>
      <select id="filter-select">
        <option value="high">High+</option>
        <option value="very-high">Very High</option>
      </select>
    </div>
    <div id="alert-list">
      <div class="empty-state">
        <div class="icon">📡</div>
        <p>Waiting for insider purchase data...<br>Alerts will appear here as they're detected.</p>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const COLORS = {
      veryHigh: '#e74c3c',
      high:     '#2ecc71'
    };

    function getColor(score) {
      if (score >= 8) return COLORS.veryHigh;
      return COLORS.high;
    }

    function getLabel(score) {
      if (score >= 8) return 'VERY HIGH';
      return 'HIGH';
    }

    function getConfClass(score) {
      if (score >= 8) return 'conf-very-high';
      return 'conf-high';
    }

    function formatMoney(val) {
      if (val >= 1000000) return '$' + (val / 1000000).toFixed(1) + 'M';
      if (val >= 1000) return '$' + (val / 1000).toFixed(0) + 'K';
      return '$' + val.toFixed(0);
    }

    function formatNumber(val) {
      return val.toLocaleString('en-US', { maximumFractionDigits: 0 });
    }

    // --- Map setup ---
    const map = L.map('map', {
      center: [39.5, -98.5],
      zoom: 4,
      zoomControl: false,
      attributionControl: false
    });

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 18,
      subdomains: 'abcd'
    }).addTo(map);

    L.control.attribution({ position: 'bottomleft', prefix: false })
      .addAttribution('&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>')
      .addTo(map);

    const markers = {};
    let allPurchases = [];

    // --- Fetch & render ---
    async function loadPurchases() {
      try {
        const resp = await fetch('/api/purchases?days=90');
        const data = await resp.json();
        allPurchases = data;
        render(data);
      } catch (e) {
        console.error('Failed to load purchases:', e);
      }
    }

    function render(purchases) {
      const filter = document.getElementById('filter-select').value;
      let filtered = purchases.filter(p => p.confidence_score >= 6);
      if (filter === 'very-high') filtered = purchases.filter(p => p.confidence_score >= 8);

      // Group by ticker for map markers
      const grouped = {};
      for (const p of filtered) {
        if (!grouped[p.ticker]) grouped[p.ticker] = [];
        grouped[p.ticker].push(p);
      }

      // Stats
      document.getElementById('stat-count').textContent = filtered.length;
      document.getElementById('stat-companies').textContent = Object.keys(grouped).length;

      // Clear old markers
      for (const key in markers) {
        map.removeLayer(markers[key]);
        delete markers[key];
      }

      // Place markers
      for (const [ticker, group] of Object.entries(grouped)) {
        const latest = group[0];
        const lat = latest.latitude;
        const lng = latest.longitude;
        const color = getColor(latest.confidence_score);

        const marker = L.circleMarker([lat, lng], {
          radius: Math.min(6 + group.length * 2, 14),
          fillColor: color,
          color: color,
          fillOpacity: 0.85,
          weight: 2,
          opacity: 0.5
        }).addTo(map);

        marker.bindPopup(buildPopup(ticker, group), {
          maxWidth: 300,
          className: 'dark-popup'
        });

        markers[ticker] = marker;
      }

      // Render sidebar
      renderSidebar(filtered, grouped);
    }

    function buildPopup(ticker, group) {
      const latest = group[0];
      const totalValue = group.reduce((s, p) => s + p.total_value, 0);
      const score = latest.confidence_score;
      const color = getColor(score);
      const label = getLabel(score);
      const confClass = getConfClass(score);

      let purchaseRows = '';
      for (const p of group.slice(0, 5)) {
        purchaseRows += `
          <div class="popup-row">
            <span class="popup-label">${p.owner_name || 'Insider'}</span>
            <span class="popup-value green">${formatMoney(p.total_value)}</span>
          </div>
          <div class="popup-row">
            <span class="popup-label">${p.officer_title || 'N/A'}</span>
            <span class="popup-value">${p.purchase_date}</span>
          </div>
        `;
      }

      if (group.length > 5) {
        purchaseRows += `<div class="popup-row"><span class="popup-label" style="color:#555">+${group.length - 5} more</span><span></span></div>`;
      }

      const summary = latest.company_summary
        ? `<div style="font-size:11px;color:#999;margin:8px 0;line-height:1.5;border-top:1px solid rgba(255,255,255,0.04);padding-top:8px">${latest.company_summary}</div>`
        : '';

      return `
        <div class="popup-content">
          <div class="popup-ticker">${ticker}</div>
          <div class="popup-company">${latest.company_name}</div>
          ${summary}
          <div class="popup-row">
            <span class="popup-label">Total Purchases</span>
            <span class="popup-value">${group.length}</span>
          </div>
          <div class="popup-row">
            <span class="popup-label">Combined Value</span>
            <span class="popup-value green">${formatMoney(totalValue)}</span>
          </div>
          ${purchaseRows}
          <div style="text-align:center">
            <span class="popup-conf ${confClass}">${label} (${score}/10)</span>
          </div>
        </div>
      `;
    }

    function renderSidebar(purchases, grouped) {
      const list = document.getElementById('alert-list');

      if (purchases.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="icon">📡</div>
            <p>No insider purchases found yet.<br>Alerts will appear here as they're detected.</p>
          </div>
        `;
        return;
      }

      let html = '';
      for (const [ticker, group] of Object.entries(grouped)) {
        const latest = group[0];
        const score = latest.confidence_score;
        const totalValue = group.reduce((s, p) => s + p.total_value, 0);
        const confClass = getConfClass(score);

        const summary = latest.company_summary
          ? `<div style="font-size:11px;color:#666;margin:4px 0 6px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${latest.company_summary}</div>`
          : '';

        html += `
          <div class="alert-card" data-ticker="${ticker}">
            <div class="ticker-row">
              <span class="ticker">${ticker}</span>
              <span class="confidence ${confClass}">${getLabel(score)} (${score})</span>
            </div>
            <div class="company">${latest.company_name}</div>
            ${summary}
            <div class="details">
              <span>${latest.purchase_date}</span>
              <span>${group.length} purchase${group.length > 1 ? 's' : ''}</span>
              <span class="value">${formatMoney(totalValue)}</span>
            </div>
          </div>
        `;
      }

      list.innerHTML = html;

      list.querySelectorAll('.alert-card').forEach(card => {
        card.addEventListener('click', () => {
          const ticker = card.dataset.ticker;
          const m = markers[ticker];
          if (m) {
            map.flyTo(m.getLatLng(), 7, { duration: 0.8 });
            m.openPopup();
          }
        });
      });
    }

    // --- Events ---
    document.getElementById('filter-select').addEventListener('change', () => {
      render(allPurchases);
    });

    // Initial load + auto-refresh every 5 minutes
    loadPurchases();
    setInterval(loadPurchases, 5 * 60 * 1000);
  </script>
</body>
</html>
